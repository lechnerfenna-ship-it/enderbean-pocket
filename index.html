<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b102b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Enderbean"><title>Enderbean Pocket 💜</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#44265c,#160e26 70%);color:#f9efff;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}main{max-width:420px;margin:auto;padding:18px 0 30px}h1{font-size:23px;text-align:center;margin:8px 0 0;letter-spacing:1px}small{display:block;text-align:center;color:#c8addb;margin:0 0 18px}.room{position:relative;border:2px solid #8b57b5;border-radius:22px;height:290px;overflow:hidden;background:linear-gradient(#302040 70%,#574064 70%);box-shadow:0 16px 40px #100a1c}.stars{position:absolute;inset:0;background-image:radial-gradient(#d5a4ff 1.5px,transparent 2px);background-size:43px 51px;opacity:.4}.lantern{position:absolute;top:18px;font-size:33px;filter:drop-shadow(0 0 15px #ffcb7a)}.lantern.left{left:20px}.lantern.right{right:20px}.bed{position:absolute;bottom:13px;left:30px;right:30px;height:62px;border-radius:18px;background:repeating-linear-gradient(90deg,#7855a2,#7855a2 28px,#8868b4 28px,#8868b4 56px);border:6px solid #4a2d65}.bean{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:142px;height:146px;background:#15111d;border:6px solid #0d0b14;border-radius:36px 36px 44px 44px;box-shadow:0 0 30px #ab65ff44;cursor:pointer;touch-action:manipulation}.bean:before,.bean:after{content:"";position:absolute;top:60px;width:43px;height:22px;border-radius:9px;background:#d9a5ff;box-shadow:0 0 17px #b75fff;animation:blink 8s infinite}.bean:before{left:14px}.bean:after{right:14px}.bean.sleep:before,.bean.sleep:after{height:4px;top:71px;box-shadow:none;animation:none}.bean.happy:before,.bean.happy:after{height:28px;background:#efc8ff}@keyframes blink{0%,93%,97%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}.cheek{position:absolute;top:92px;left:20px;color:#8f5c9c;font-size:18px}.cheek.two{left:auto;right:20px}.hearts{position:absolute;top:28px;width:100%;text-align:center;font-size:27px;opacity:0;transition:.2s;pointer-events:none}.hearts.show{opacity:1;transform:translateY(-12px)}.bubble{margin:13px auto;padding:12px 16px;background:#39244f;border:1px solid #8059a7;border-radius:16px;text-align:center;min-height:48px;font-weight:600}.meters{background:#241731;border:1px solid #684780;border-radius:18px;padding:14px}.meter{margin:7px 0 15px}.meter:last-child{margin-bottom:2px}.meta{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.track{height:11px;background:#4d365e;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#a85fe9,#e4a5ff);width:100%;border-radius:99px;transition:width .4s}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.buttons button{border:1px solid #b27bd5;border-radius:14px;padding:14px 8px;background:#51316b;color:white;font-size:15px;font-weight:700;cursor:pointer}.buttons button:active{transform:scale(.97)}section{background:#241731;border:1px solid #684780;border-radius:18px;padding:14px}h2{font-size:16px;margin:0 0 9px}#journal{font-size:13px;color:#d9c7e5;max-height:130px;overflow:auto}#journal p{margin:7px 0}footer{text-align:center;color:#bba3ce;font-size:12px;margin:14px 0}.hint{font-size:12px;color:#c5b1d5;text-align:center;margin-bottom:12px}</style></head><body><main><h1>💜 ENDERBEAN POCKET</h1><small>tiny bean · big dreams 🌱</small><div class="room"><div class="stars"></div><div class="lantern left">🏮</div><div class="lantern right">🏮</div><div class="bed"></div><div class="hearts" id="hearts">💜 💜 💜</div><div class="bean" id="bean" role="button" tabindex="0" aria-label="Geef Enderbean aandacht"><span class="cheek">♥</span><span class="cheek two">♥</span></div></div><div class="bubble" id="speech">Mama! You're here! 💜</div><div class="hint">Tik op zijn koppie om hem te horen praten</div><div class="meters"><div class="meter"><div class="meta"><span>🌱 Hunger</span><span id="hungerN">100%</span></div><div class="track"><div class="fill" id="hunger"></div></div></div><div class="meter"><div class="meta"><span>💜 Happiness</span><span id="happyN">100%</span></div><div class="track"><div class="fill" id="happy"></div></div></div><div class="meter"><div class="meta"><span>💤 Energy</span><span id="energyN">100%</span></div><div class="track"><div class="fill" id="energy"></div></div></div></div><div class="buttons"><button id="feed">🌱 Feed grass</button><button id="cuddle">💜 Give cuddles</button><button id="sleep">💤 Bedtime</button><button id="wake">☀️ Wake up</button></div><section><h2>📖 Enderbean's little diary</h2><div id="journal"></div></section><footer>Made with love for Enderbean ♡<br>Progress saved on this device</footer></main><script>
const KEY='enderbean-pocket-v1',now=Date.now(),clamp=n=>Math.max(0,Math.min(100,Math.round(n)));let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s)s={hunger:100,happy:100,energy:100,last:now,diary:[],line:0,asleep:false};const hours=Math.min(48,Math.max(0,(now-(s.last||now))/3600000));s.hunger=clamp(s.hunger-hours*3);s.happy=clamp(s.happy-hours*2);s.energy=clamp(s.energy+(s.asleep?hours*9:-hours*2));s.last=now;const $=id=>document.getElementById(id),lines=['I love you, mama! 💜','Can we play Minecraft? 🌱','Mama, I need a hug! 🥺',"You're my favorite human! 👑",'Five more minutes... zzz 💤'];let heartTimer;function save(){s.last=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}function render(){for(const [k,id] of [['hunger','hunger'],['happy','happy'],['energy','energy']]){$(id).style.width=s[k]+'%';$(id+'N').textContent=s[k]+'%'}$('bean').classList.toggle('sleep',s.asleep);$('journal').innerHTML='';for(const item of s.diary.slice(0,10)){let p=document.createElement('p');p.textContent=item;$('journal').append(p)}save()}function say(t){$('speech').textContent=t}function diary(t){s.diary.unshift(new Date().toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+' · '+t);s.diary=s.diary.slice(0,20)}function hearts(){clearTimeout(heartTimer);$('hearts').classList.add('show');$('bean').classList.add('happy');heartTimer=setTimeout(()=>{$('hearts').classList.remove('show');$('bean').classList.remove('happy')},2500)}function talk(){s.asleep=false;s.happy=clamp(s.happy+2);say(lines[s.line%lines.length]);s.line++;render()}$('bean').onclick=talk;$('bean').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();talk()}};$('feed').onclick=()=>{s.hunger=clamp(s.hunger+25);s.happy=clamp(s.happy+5);say('Yummy! Grass blocks! Thank you mama! 🌱');diary('Mama gave me a delicious grass block!');hearts();render()};$('cuddle').onclick=()=>{s.happy=clamp(s.happy+20);say('Best cuddles ever! 💜');diary('Got the warmest mama cuddles.');hearts();render()};$('sleep').onclick=()=>{s.asleep=true;s.energy=clamp(s.energy+8);say('Night night, mama... 💤');diary('Snuggled into my tiny bed.');render()};$('wake').onclick=()=>{s.asleep=false;s.energy=clamp(s.energy+5);say('Good morning, mama! ☀️');diary('Woke up and saw mama!');render()};if(!s.diary.length)diary('Moved into my cozy pocket home!');render();setInterval(()=>{s.hunger=clamp(s.hunger-.05);s.happy=clamp(s.happy-.03);s.energy=clamp(s.energy+(s.asleep?.12:-.04));render()},60000);
</script></body></html>
